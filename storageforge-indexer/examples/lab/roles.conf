# What each config in nodes.conf can do, so tests pick hosts by ability and not by name.
# name | abilities | package manager as scanned | full seed folder | room to write | btrfs subvolume to send | its snapshots | btrfs folder to receive into | mount to fill | names the topology must show
sf-ctl|controller,deploy|apt-get||/srv|||||
sf-ubuntu|deploy,zfs,docker,zfs-pool:tank|apt-get|/tank/media|/tank/backups||||/backup|tank,backup
sf-fedora|deploy,btrfs,btrfs-raid,selinux,btrfs-profile:raid1|dnf|/data/media|/data/backups|/data/media|/data/snaps|/data/backups/recv|/data/backups|sfdata
sf-rocky|deploy,lvm,selinux,podman,vg:vgdata,lv:data|dnf|/srv/data|/srv/data||||/srv/data|vgdata
sf-suse|deploy,btrfs,btrfs-nested,md,selinux,btrfs-child:/srv/btrfs/var|zypper|/srv/btrfs/home|/srv/btrfs|/srv/btrfs/home|/srv/btrfs/.snapshots|/srv/btrfs/recv|/mnt/raid|md0
sf-arch|deploy,btrfs,luks,mergerfs|pacman|/mnt/pool|/mnt/disk1|||/srv/recv|/mnt/disk2|secure,mergerfs
sf-alpine|nosystemd|none|/srv/seed|/srv/seed||||/mnt/fat|
sf-bookworm|deploy,btrfs,btrfs-raid,btrfs-quota,btrfs-profile:raid10,btrfs-mount:/srv/pool|apt-get|/srv/pool/media|/srv/pool/backups|/srv/pool/media|/srv/pool/snaps|/srv/pool/recv|/srv/pool/backups|sfraid10
sf-tumbleweed|deploy,btrfs,btrfs-raid,btrfs-reflink,btrfs-profile:raid1c3,btrfs-mount:/srv/c3|zypper|/srv/c3/media|/srv/c3/backups|/srv/c3/media|/srv/c3/snaps|/srv/c3/recv|/srv/c3/backups|sfc3
sf-leap15|deploy,btrfs,btrfs-nested,btrfs-child:/srv/deep/a/b,btrfs-spare:3,btrfs-mount:/srv/deep|zypper|/srv/deep/a|/srv/plain|/srv/deep/a|/srv/deep/snaps|/srv/deep/recv|/srv/plain|
sf-jammy|deploy,zfs,zfs-pool:vault|apt-get|/vault/media|/vault/backups||||/vault|vault
sf-alma9|deploy,md,selinux|dnf|/srv/raid5|/srv/raid5||||/srv/raid5|md0
sf-alma10|deploy,lvm,luks,selinux,vg:vgsealed,lv:media|dnf|/srv/media|/srv/media||||/srv/docs|vgsealed
sf-rocky10|deploy,lvm,selinux,vg:vgthin,lv:data|dnf|/srv/thin|/srv/thin||||/srv/thin|vgthin
sf-pve|deploy,zfs,zfs-pool:tank,appliance,proxmox|apt-get|/tank/media|/tank/backups||||/tank/backups|tank
sf-truenas|appliance,truenas,zfs-pool:tank|apt-get|/mnt/tank/media|/mnt/tank/backups||||/mnt/tank/backups|tank
sf-xcp|appliance,xen|yum|||||||
sf-mikrotik|router,routeros,appliance|none|||||||
sf-openwrt|router,openwrt,appliance|none|||||||
sf-wan-host|segment,appliance|none|||||||
sf-lan-client|segment,appliance|none|||||||
sf-dmz-server|segment,appliance|none|||||||
