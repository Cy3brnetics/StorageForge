# The lab's VMs. Adding a VM is one line; each runs on the sflab network at 10.77.0.0/24.
# sf-ctl has 2 vCPUs because docker-compose.yml limits StorageForge to 2.0 CPUs, and Docker refuses a limit above the machine.
# sf-rocky has 2 GB because dnf is killed for lack of memory at 1 GB once EPEL is on, and rsnapshot comes from EPEL.
# name | image (images.conf) | osinfo | vcpu | RAM MB | root GB | IP | data disks in GB (provision/<vm>.sh lays them out)
sf-ctl|debian13|debian13|2|2048|20|10.77.0.10|
sf-ubuntu|ubuntu2404|ubuntu24.04|1|1536|10|10.77.0.11|2,2,2,2
sf-fedora|fedora44|fedora44|1|1024|10|10.77.0.12|2,2
sf-rocky|rocky9|rocky9|1|2048|10|10.77.0.13|4
sf-suse|leap16|opensuse16.0|1|1024|10|10.77.0.14|2,2,2
sf-arch|arch|archlinux|1|1024|10|10.77.0.15|2,2,2
sf-alpine|alpine324|alpinelinux3.24|1|1024|4|10.77.0.16|1,1
