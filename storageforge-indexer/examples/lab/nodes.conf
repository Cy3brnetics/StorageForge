# The pool of configs. A build runs 7 of them (roles.py picks, roles.conf says what each can do). Each runs on the sflab network at 10.77.0.0/24.
# sf-ctl has 2 vCPUs because docker-compose.yml limits StorageForge to 2.0 CPUs, and Docker refuses a limit above the machine.
# The Enterprise Linux configs have 2 GB because dnf is killed for lack of memory at 1 GB once EPEL is on, and rsnapshot comes from EPEL.
