# Where seed data goes: VM | folder (lab-seed is created inside it) | profile.
# full has awkward names, permissions and links; plain is simple files, for filesystems that can't hold the rest.
sf-ubuntu|/tank/media|full
sf-fedora|/data/media|full
sf-rocky|/srv/data|full
sf-suse|/srv/btrfs/home|full
sf-suse|/srv/btrfs/var|plain
sf-suse|/mnt/raid|plain
sf-arch|/mnt/pool|full
sf-arch|/mnt/secure|plain
sf-alpine|/srv/seed|full
sf-alpine|/mnt/fat|plain
sf-alpine|/mnt/exfat|plain
