# StorageForge production stack.
#   docker compose up -d --build        # the first deploy creates the secrets and a self-signed TLS cert (init-secrets below)
#   docker compose exec storageforge storageforge-index user add admin
#   open https://<this machine>:8443    # sign in with that account (accept the self-signed certificate once)
# Meant for a LAN. Do not publish it on the internet.
name: storageforge

services:
  # Runs once per deploy and exits: fills the secret volumes, keeping whatever is already in them (docker/init-volumes.sh)
  init-secrets:
    build: &runtime-build
      context: .
      target: runtime
    image: storageforge:0.3.1
    restart: "no"
    user: "0:0"                # owns the files for uid 10001 and uid 101
    read_only: true
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt:
      - no-new-privileges:true
    network_mode: host         # to name the host's hostname and address in the certificate; it listens on nothing
    entrypoint: ["/usr/local/bin/storageforge-init-volumes"]
    environment:
      STORAGEFORGE_TLS_NAMES: ${STORAGEFORGE_TLS_NAMES:-}
    healthcheck:
      disable: true
    volumes:
      - sf-secrets:/secrets/app
      - sf-tls:/secrets/proxy
      - sf-data:/app/data:ro   # a database with no secret is an error, not a new secret
      # Secrets from docker/init-secrets.sh, for a stack that had them before these volumes. Empty otherwise.
      - ${STORAGEFORGE_SECRETS_DIR:-./secrets}:/seed:ro

  storageforge:
    build: *runtime-build
    image: storageforge:0.3.1
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    restart: unless-stopped
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      STORAGEFORGE_VAULT_SECRET_FILE: /run/sf-secrets/vault_secret
      STORAGEFORGE_SESSION_SECRET_FILE: /run/sf-secrets/session_secret
      STORAGEFORGE_COOKIE_SECURE: ${STORAGEFORGE_COOKIE_SECURE:-1}   # the session cookie only travels over https (proxy below)
      STORAGEFORGE_COOKIE_SUFFIX: ${STORAGEFORGE_COOKIE_SUFFIX:-}    # its own session cookie when sites share a machine (docker/sf-site)
      STORAGEFORGE_PROXY_HOPS: ${STORAGEFORGE_PROXY_HOPS:-1}         # the proxy below sets X-Forwarded-For (real client IP)
      STORAGEFORGE_PROXY_HOST: proxy                                  # ...believed only from it, not from other containers
      STORAGEFORGE_SCAN_INTERVAL: ${STORAGEFORGE_SCAN_INTERVAL:-6h}
      STORAGEFORGE_SCAN_WORKERS: ${STORAGEFORGE_SCAN_WORKERS:-4}          # hosts scanned at once
      STORAGEFORGE_BACKUP_HOUR: ${STORAGEFORGE_BACKUP_HOUR:-3}            # nightly essentials backup + prune (local hour)
      STORAGEFORGE_BACKUP_KEEP: ${STORAGEFORGE_BACKUP_KEEP:-14}
      STORAGEFORGE_BACKUP_FULL_KEEP: ${STORAGEFORGE_BACKUP_FULL_KEEP:-0}  # >0: also a full copy nightly (large)
      STORAGEFORGE_ACCESS_LOG: ${STORAGEFORGE_ACCESS_LOG:-changes}        # all | changes | off
      STORAGEFORGE_REPORT_CA_FILE: /run/sf-secrets/tls_cert              # deployed jobs trust this certificate for reports
    group_add: ["${STORAGEFORGE_SECRETS_GID:-1000}"]   # lists ./keys through the host group (docker/init-secrets.sh)
    volumes:
      - sf-secrets:/run/sf-secrets:ro   # no TLS key here: that stays with the proxy
      - sf-data:/app/data
      # Backups in their own volume. Copy them off this machine (e.g. a Moves mirror step to another host).
      - sf-backups:/app/backups
      - /etc/localtime:/etc/localtime:ro   # nightly jobs run at the host's local time
      # Optional one-shot key import (file name = key name). Read-only.
      - ${STORAGEFORGE_KEY_IMPORT_DIR:-./keys}:/run/secrets/ssh-import:ro
      # Fingerprints in use on other sites of this machine, written by docker/sf-site
      - ${STORAGEFORGE_FOREIGN_KEYS:-/dev/null}:/run/sf-foreign:ro
    tmpfs:
      # Ephemeral ssh-agent sockets live here; never on disk.
      - /run/storageforge:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    networks: [sf]
    # no published port: plain HTTP stays on the compose network, and browsers come in through the proxy
    ulimits:
      nofile: { soft: 4096, hard: 8192 }
      memlock: { soft: 16777216, hard: 16777216 }       # lets the vault mlock() decrypted key buffers
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2g, pids: 256 }   # 1g was hit constantly with a 6M-file index
        reservations: { cpus: "0.25", memory: 256m }
    healthcheck:
      test: ["CMD", "storageforge-index", "healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  # For commands that change the secrets themselves; `up` leaves it out:
  #   docker compose stop storageforge proxy
  #   docker compose run --rm admin reset --site-name "Acme" --yes
  # The archive folder holds a client's keys and their secret, so only this service mounts it. Make it first:
  #   sudo install -d -o 10001 -g 10001 -m 0700 archive
  admin:
    profiles: [admin]
    build: *runtime-build
    image: storageforge:0.3.1
    depends_on:
      init-secrets: { condition: service_completed_successfully }
    restart: "no"
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    network_mode: none
    environment:
      STORAGEFORGE_VAULT_SECRET_FILE: /run/sf-secrets/vault_secret
      STORAGEFORGE_ARCHIVE_DIR: /app/archive
    group_add: ["${STORAGEFORGE_SECRETS_GID:-1000}"]   # to check ./keys is empty
    volumes:
      - sf-secrets:/run/sf-secrets
      - sf-data:/app/data
      - sf-backups:/app/backups
      - ${STORAGEFORGE_ARCHIVE_DIR:-./archive}:/app/archive
      - /etc/localtime:/etc/localtime:ro
      - ${STORAGEFORGE_KEY_IMPORT_DIR:-./keys}:/run/secrets/ssh-import:ro
      - ${STORAGEFORGE_FOREIGN_KEYS:-/dev/null}:/run/sf-foreign:ro
    tmpfs:
      - /run/storageforge:rw,noexec,nosuid,nodev,size=16m,mode=0700,uid=10001,gid=10001
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    healthcheck:
      disable: true

  # TLS for the LAN: nginx (config built in) with the self-signed certificate from init-secrets
  proxy:
    build:
      context: .
      target: proxy
    image: storageforge-proxy:0.3.1
    restart: unless-stopped
    depends_on:
      storageforge: { condition: service_healthy }
    user: "101:101"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - sf-tls:/run/secrets:ro
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,uid=101,gid=101
    networks: [sf]
    ports:
      # every interface by default, so the LAN can reach it; STORAGEFORGE_HTTPS_BIND=127.0.0.1 keeps it on this machine
      - "${STORAGEFORGE_HTTPS_BIND:-0.0.0.0}:${STORAGEFORGE_HTTPS_PORT:-8443}:8443"
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 64m, pids: 32 }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "3" }

volumes:
  sf-secrets:
  sf-tls:
  sf-data:
  sf-backups:

networks:
  sf:
    driver_opts:
      # A fixed bridge name, so a host firewall can allow SSH from this container to the Docker host itself:
      #   sudo ufw allow in on sf0 to any port 22 proto tcp
      com.docker.network.bridge.name: ${STORAGEFORGE_BRIDGE:-sf0}
