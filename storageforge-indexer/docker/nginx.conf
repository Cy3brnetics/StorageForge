# TLS in front of StorageForge on the LAN: a self-signed certificate from docker/init-secrets.sh.
# Runs unprivileged (uid 101) on a read-only root filesystem; everything it writes goes to the /tmp tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    access_log off;                  # StorageForge logs the requests that change something
    server_tokens off;

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:tls:1m;
        ssl_session_tickets off;
        # plain http:// to this port gets a redirect instead of nginx's "plain HTTP request sent to HTTPS port" page
        error_page 497 =301 https://$http_host$request_uri;      # $http_host keeps the port the browser used

        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 3m;     # the planner's 2 MiB designs; StorageForge enforces its own limits too

        location / {
            proxy_pass http://storageforge:8080;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            # replaced, not appended: with STORAGEFORGE_PROXY_HOPS=1 a client cannot pick its own address
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 6h;   # a snapshot restore answers when the copy is done
            proxy_send_timeout 6h;
            proxy_buffering off;
        }
    }
}
