# TLS in front of StorageForge on the LAN: a self-signed certificate from docker/init-volumes.sh.
# Runs unprivileged (uid 101) on a read-only root filesystem; everything it writes goes to the /tmp tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;
    access_log off;                  # StorageForge logs the requests that change something
    server_tokens off;

    server {
        listen 8443 ssl;
        http2 on;
        ssl_certificate     /run/secrets/tls_cert;
        ssl_certificate_key /run/secrets/tls_key;
        ssl_protocols TLSv1.2 TLSv1.3;
        # TLS 1.2 with forward secrecy and AEAD only (Mozilla's intermediate list); TLS 1.3 has only such suites
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:tls:1m;
        ssl_session_tickets off;
        # plain http:// to this port gets a redirect instead of nginx's "plain HTTP request sent to HTTPS port" page
        error_page 497 =301 https://$http_host$request_uri;      # $http_host keeps the port the browser used

        add_header Strict-Transport-Security "max-age=31536000" always;
        client_max_body_size 3m;     # the planner's 2 MiB designs; StorageForge enforces its own limits too

        # Docker's DNS, asked again as entries expire: a recreated storageforge container has a new address, and a
        # name in proxy_pass itself is resolved once, at start (502s until the proxy restarts too)
        resolver 127.0.0.11 valid=10s ipv6=off;

        location / {
            set $app http://storageforge:8080;
            proxy_pass $app;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;   # appended: STORAGEFORGE_PROXY_HOPS counts from the end
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 35m;  # the longest request runs one command on a host (30 min); restores run in the background
            proxy_send_timeout 35m;
            proxy_buffering off;
        }
    }
}
