[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storageforge-indexer"
version = "0.2.0"
description = "Agentless SSH file indexer, cross-host file search and storage architecture reports"
requires-python = ">=3.10"
dependencies = ["cryptography>=44", "flask>=3.1", "flask-login>=0.6.3", "flask-limiter>=3.8", "waitress>=3.0"]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
yaml = ["pyyaml>=6"]

[project.scripts]
storageforge-index = "storageforge_index.cli:main"
storageforge-askpass = "storageforge_index.askpass:main"

[tool.setuptools.packages.find]
include = ["storageforge_index*"]

[tool.setuptools.package-data]
storageforge_index = ["migrations/*/*.sql", "static/*"]
