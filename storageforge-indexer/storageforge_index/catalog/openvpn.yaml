format: 1
id: openvpn
revision: 1
name: OpenVPN
app_version: from the distribution
category: vpn
summary: TLS-based VPN server with its own PKI, client certificates and certificate revocation list (CRL).
homepage: https://openvpn.net/
license: GPL-2.0
install:
  methods:
    - kind: package
      packages:
        apt: [openvpn, easy-rsa]
        dnf: [openvpn, easy-rsa]
        zypper: [openvpn, easy-rsa]
        pacman: [openvpn, easy-rsa]
requires:
  ports: [1194/udp]
exposure:
  default: any
  public_optional: true
backup:
  paths: [/etc/openvpn]
  consistency: live
gui:
  native: none
  panel:
    level: status
    adapter: openvpn
upgrade:
  strategy: package
risk: [holds-credentials, internet-listener]
notes: Scans read the server status file, client certificate expiry dates and CRL nextUpdate date, alerting before the CRL lapses.
