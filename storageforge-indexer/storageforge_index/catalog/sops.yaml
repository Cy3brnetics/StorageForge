format: 1
id: sops
revision: 1
name: SOPS
app_version: 3.13.3
category: secrets
summary: Encrypts the values in YAML, JSON and env files with age or PGP keys, so they can sit in Git. The IaC exports refer to secrets this way.
homepage: https://getsops.io/
license: MPL-2.0
install:
  methods:
    - kind: binary
      name: sops
      files:
        x86_64:
          url: https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64
          sha256: e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b
        aarch64:
          url: https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.arm64
          sha256: 53b0abacd38ef1b12a66d6c100956691b9cefce018d91f81e73ddf7438b94d77
requires:
  ports: []
exposure:
  default: loopback
  public_optional: false
gui:
  native: none
  panel:
    level: status
    adapter: sops
upgrade:
  strategy: binary
notes: The SHA-256 of each file is the one getsops publishes in sops-v3.13.3.checksums.txt. It needs a key to encrypt to; install age beside it. The private age key stays with whoever decrypts.
