format: 1
id: wazuh
revision: 1
name: Wazuh
app_version: 4.11.1
category: detection
summary: Host intrusion detection, log analysis, file integrity monitoring and vulnerability correlation manager.
homepage: https://wazuh.com/
license: GPL-2.0
install:
  methods:
    - kind: container
      image: docker.io/wazuh/wazuh-manager:4.11.1@sha256:f5405654526a75060ef962484a8e920a12977f8e64abaad183652bd71ce0d55a
      ports: ["1514:1514/tcp", "1515:1515/tcp", "55000:55000/tcp"]
      volumes: {data: /var/ossec/data, logs: /var/ossec/logs}
requires:
  ports: [1514/tcp, 1515/tcp, 55000/tcp]
  volumes: [data, logs]
exposure:
  default: loopback
  public_optional: false
backup:
  paths: [data, logs]
  consistency: stop-snapshot
gui:
  native: none
  panel:
    level: status
    adapter: wazuh
upgrade:
  strategy: recreate
risk: [holds-credentials]
compliance: [intrusion detection]
notes: Fence ports 1514 and 1515 to enrolled agent subnets when switching exposure from loopback to management.
