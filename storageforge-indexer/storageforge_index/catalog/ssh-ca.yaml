format: 1
id: ssh-ca
revision: 1
name: SSH CA
app_version: StorageForge
category: access
summary: Short-lived SSH certificates from the CA StorageForge keeps in its vault. This makes a host trust that CA; the CA itself is under Keys.
homepage: https://www.openssh.com/
license: BSD-2-Clause
install:
  methods:
    - kind: package
      packages:
        apt: [openssh-server]
        dnf: [openssh-server]
        zypper: [openssh-server]
        pacman: [openssh]
inputs:
  - {name: users, kind: options, label: "Users a certificate may log in as", default: root}
steps:
  - type: ssh-ca-trust
    params: {users: "{users}", state: present}
exposure:
  default: loopback
  public_optional: false
gui:
  native: none
  panel:
    level: status
    adapter: ssh-ca
upgrade:
  strategy: package
risk: [runs-as-root]
notes: "The CA is a feature of StorageForge, not a program on the host: make it under Keys, SSH CA, where certificates are issued and revoked. This entry checks that sshd is installed and runs the ssh-ca-trust step, which keeps authorized_keys working, checks sshd -t, and puts a rejected change back."
