format: 1
id: strongswan
revision: 1
name: strongSwan
app_version: from the distribution
category: vpn
summary: IPsec with IKEv2, for site-to-site tunnels and road warriors, configured with swanctl. The panel shows each SA and tunnel.
homepage: https://www.strongswan.org/
license: GPL-2.0
install:
  methods:
    - kind: package
      packages:
        apt: [strongswan-swanctl, charon-systemd]
        dnf: [strongswan]
        zypper: [strongswan]
        pacman: [strongswan]
      units: [strongswan.service]
requires:
  ports: [500/udp, 4500/udp]
exposure:
  default: any
  public_optional: true
backup:
  paths: [/etc/swanctl]
gui:
  native: none
  panel:
    level: status
    adapter: strongswan
upgrade:
  strategy: package
risk: [internet-listener, net-admin, holds-credentials]
notes: "It starts with no connection: write each one in /etc/swanctl/conf.d and load it with swanctl --load-all. Keep pre-shared keys and private keys in /etc/swanctl, readable by root alone. IKE listens on UDP 500 and 4500 on every address: fence them to the peers you expect."
