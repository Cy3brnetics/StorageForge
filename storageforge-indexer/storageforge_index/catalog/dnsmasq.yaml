format: 1
id: dnsmasq
revision: 1
name: dnsmasq
app_version: from the distribution
category: dns
summary: A small DNS forwarder and DHCP server, for local names on a small network.
homepage: https://thekelleys.org.uk/dnsmasq/doc.html
license: GPL-2.0
install:
  methods:
    - kind: package
      packages:
        apt: [dnsmasq]
        dnf: [dnsmasq]
        zypper: [dnsmasq]
        pacman: [dnsmasq]
      units: [dnsmasq.service]
requires:
  ports: [53/udp, 53/tcp]
exposure:
  default: management
  public_optional: false
backup:
  paths: [/etc/dnsmasq.conf, /etc/dnsmasq.d]
gui:
  native: none
  panel:
    level: status
    adapter: dnsmasq
upgrade:
  strategy: package
risk: [internet-listener]
notes: Debian, Ubuntu and Arch start it answering on every interface; put listen-address and bind-interfaces in /etc/dnsmasq.conf. Where systemd-resolved runs, dnsmasq cannot start on every address until it is bound to one.
