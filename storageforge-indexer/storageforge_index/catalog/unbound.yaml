format: 1
id: unbound
revision: 1
name: Unbound
app_version: from the distribution
category: dns
summary: A validating, caching DNS resolver. The status shows whether it runs, its uptime and its queries, from unbound-control.
homepage: https://nlnetlabs.nl/projects/unbound/about/
license: BSD-3-Clause
install:
  methods:
    - kind: package
      packages:
        apt: [unbound]
        dnf: [unbound]
        zypper: [unbound]
        pacman: [unbound]
      units: [unbound.service]
requires:
  ports: [53/udp, 53/tcp]
exposure:
  default: loopback
  public_optional: false
backup:
  paths: [/etc/unbound]
gui:
  native: none
  panel:
    level: status
    adapter: unbound
upgrade:
  strategy: package
risk: []
notes: The distributions start it on 127.0.0.1 only; serving other hosts takes an interface and an access-control line in /etc/unbound. unbound-control answers once remote-control is on, as Debian and Ubuntu set it.
