format: 1
id: nextcloud
revision: 1
name: Nextcloud
app_version: 35.0.3
category: storage
summary: Files, calendars and contacts in the browser and on phones, synced to desktops.
homepage: https://nextcloud.com/
license: AGPL-3.0
install:
  methods:
    - kind: container
      image: docker.io/library/nextcloud:35.0.3-apache@sha256:f22d1dd63844bd15bbf6c2019149653c3d1c775ba48b173b56c3c6ad5f386196
      ports: ["8081:80/tcp"]
      volumes: {data: /var/www/html}
      env: {NEXTCLOUD_ADMIN_USER: admin, NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud/admin_password, SQLITE_DATABASE: nextcloud, NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1}
    - kind: quadlet
      image: docker.io/library/nextcloud:35.0.3-apache@sha256:f22d1dd63844bd15bbf6c2019149653c3d1c775ba48b173b56c3c6ad5f386196
      ports: ["8081:80/tcp"]
      volumes: {data: /var/www/html}
      env: {NEXTCLOUD_ADMIN_USER: admin, NEXTCLOUD_ADMIN_PASSWORD_FILE: /run/secrets/nextcloud/admin_password, SQLITE_DATABASE: nextcloud, NEXTCLOUD_TRUSTED_DOMAINS: localhost 127.0.0.1}
requires:
  ports: [8081/tcp]
  volumes: [data]
exposure:
  default: loopback
  public_optional: false
  behind: reverse-proxy
secrets:
  - {name: admin_password, kind: password}
storage:
  use: data
  worm: recommended
  canaries: none
health:
  url: http://127.0.0.1:8081/status.php
  expect: 200
backup:
  paths: [data]
  consistency: stop-snapshot
gui:
  native:
    url_template: "http://{host}:{port}/"
    port: 8081
    sso: oidc
  panel:
    level: status
    adapter: nextcloud
upgrade:
  strategy: recreate
  rollback_on_unhealthy: false
risk: [holds-credentials]
mac:
  selinux: container_t
  notes: the data folder is mounted with :Z, for this container alone
notes: The admin account is admin, its password the vault secret tool-nextcloud-admin_password, read from a file on the first start. It keeps its database in SQLite, which suits a few people; behind the reverse proxy, add its name to NEXTCLOUD_TRUSTED_DOMAINS with an override of the entry.
