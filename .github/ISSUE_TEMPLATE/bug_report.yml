name: Bug report
description: Something StorageForge did, or failed to do, that it should not have.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Before you post, take out passwords, keys, tokens, and any host name or address you would rather not publish.
        A security problem goes to a private report instead: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: The smallest set of steps. If a generated script misbehaved, its dry-run output helps most.
      placeholder: |
        1. Scan a host with ...
        2. Plan ...
        3. Deploy ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: StorageForge version
      description: From the changelog, `pip show storageforge-indexer`, or the image tag.
      placeholder: 0.4.0
    validations:
      required: true
  - type: dropdown
    id: database
    attributes:
      label: Database
      options: [SQLite, PostgreSQL, Not sure]
    validations:
      required: true
  - type: textarea
    id: hosts
    attributes:
      label: The hosts involved
      description: Distribution and version, init system, and the filesystems or devices concerned (btrfs, ZFS, LVM, mdadm, RouterOS, OpenWrt...).
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Server log, the script's output, or the browser console. Check it for secrets first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and the troubleshooting page.
          required: true
        - label: I removed passwords, keys, tokens and anything else I would not publish.
          required: true
