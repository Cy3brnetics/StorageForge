# The GitHub copy of .forgejo/workflows/ci.yml. Three things differ: GitHub runs the job on the runner itself, so PostgreSQL is reached on
# localhost through a published port; the image job runs on ubuntu-latest, which has Docker; and only GitHub cancels a run a newer push
# replaces (concurrency, which older Forgejo runners don't take). Change both files together, and keep the action SHAs the same:
# Dependabot bumps them here (.github/dependabot.yml), and the zizmor job audits both.
name: CI
on:
  push:
  pull_request:

permissions: {}

# a new push to a branch or pull request cancels the run it replaces
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: storageforge-indexer

jobs:
  test:
    name: Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sf
          POSTGRES_PASSWORD: sftest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sf" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers  # tests/ci.sh runs as another user, who must find them
      # empty is SQLite (tests/dbfactory.py); each block runs on both
      STORAGEFORGE_TEST_PG: ${{ matrix.database == 'postgres' && 'postgresql://sf:sftest@localhost:5432/postgres' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Tools the tests call
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client openssh-server util-linux rsync shellcheck
      - name: Install
        run: python -m pip install -e ".[postgres,test]" playwright && python -m playwright install --with-deps chromium
      - name: Planner and capacity.py agree
        run: node tests/vectors/check.mjs
      # the blocks of tests/blocks.py, so a red step says which: light is quick and pure, medium runs bash and local tools,
      # heavy runs Chromium, sshd, Docker and real waits, and deep runs the random tests again with many examples and a fresh seed
      - name: Light
        run: bash tests/ci.sh light
      - name: Medium
        if: ${{ !cancelled() }}      # every block reports, even after one fails
        run: bash tests/ci.sh medium
      - name: Heavy
        if: ${{ !cancelled() }}      # every block reports, even after one fails
        run: bash tests/ci.sh heavy
      - name: Random, deep
        if: ${{ !cancelled() }}      # every block reports, even after one fails
        run: bash tests/ci.sh deep

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: Ruff
        run: python -m pip install ruff && ruff check storageforge_index tests
      - name: Shell scripts
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck --severity=error docker/*.sh examples/demo/*.sh

  image:
    name: Image scan
    permissions:
      contents: read
    # Fails on a critical that is not decided in .trivyignore. See notebook/Audit 2026-10-31/Container scan triage 2026-10-31.md
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Image scan
        run: |
          docker build -t storageforge:ci --target runtime storageforge-indexer
          docker save storageforge:ci -o /tmp/image.tar
          docker run --rm -v /tmp/image.tar:/image.tar:ro -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:latest \
            image --quiet --input /image.tar --severity CRITICAL --exit-code 1 --ignorefile /.trivyignore

  enclave:
    # The key enclave's micro VM image (docs/security.md, "Key enclave"): built twice from pinned sources and the two compared, compared with
    # the hashes the repository records (enclave/image/SHA256SUMS), its dependencies scanned, cross-compiled for arm64, and signed with the
    # release key where this run is given it (the secret STORAGEFORGE_RELEASE_KEY, an SSH private key). A fork or a pull request is given
    # no key: there the image is built and compared, and not signed.
    name: Enclave image
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Build, twice
        run: |
          sh enclave/image/build.sh /tmp/enclave-a
          sh enclave/image/build.sh /tmp/enclave-b
      - name: Two builds give the same bytes
        run: cmp /tmp/enclave-a/SHA256SUMS /tmp/enclave-b/SHA256SUMS
      - name: And they are the bytes the repository records
        run: diff enclave/image/SHA256SUMS /tmp/enclave-a/SHA256SUMS
      - name: Dependencies scanned
        run: |
          docker run --rm -v "$PWD/Cargo.lock:/src/Cargo.lock:ro" aquasec/trivy:latest \
            fs --quiet --scanners vuln --severity HIGH,CRITICAL --exit-code 1 /src
      - name: arm64, cross-compiled
        run: |
          ARCH=arm64 sh enclave/image/build.sh /tmp/enclave-arm64
          diff enclave/image/SHA256SUMS.arm64 /tmp/enclave-arm64/SHA256SUMS
      - name: Signed with the release key
        env:
          RELEASE_KEY: ${{ secrets.STORAGEFORGE_RELEASE_KEY }}
        run: |
          if [ -z "$RELEASE_KEY" ]; then echo "this run was given no release key: the image is built and compared, not signed"; exit 0; fi
          umask 077
          trap 'rm -f /tmp/release-key' EXIT
          printf '%s\n' "$RELEASE_KEY" > /tmp/release-key
          for out in /tmp/enclave-a /tmp/enclave-arm64; do
            sh enclave/image/sign.sh "$out" /tmp/release-key
            cat "$out/SHA256SUMS" "$out/SHA256SUMS.sig"
          done
          if [ -f enclave/image/allowed_signers ]; then
            sh enclave/image/sign.sh --verify /tmp/enclave-a enclave/image/allowed_signers
            sh enclave/image/sign.sh --verify /tmp/enclave-arm64 enclave/image/allowed_signers
          fi

  agent:
    # The optional agent's two programs (docs/agent.md): the Rust unit tests, in the container the programs are built in, then both
    # programs built twice, static, for x86_64 and arm64, and the two builds compared. Their dependencies are the workspace's one
    # Cargo.lock, which the enclave job scans. The agent's image is the `agent` stage of the Dockerfile.
    name: Agent programs
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Rust unit tests
        run: sh agent/build.sh --test
      - name: Build, twice
        run: |
          sh agent/build.sh /tmp/agent-a
          sh agent/build.sh /tmp/agent-b
      - name: Two builds give the same bytes
        run: cmp /tmp/agent-a/SHA256SUMS /tmp/agent-b/SHA256SUMS

  zizmor:
    # Audits these workflows for template injection, persisted credentials, unpinned actions and broad permissions.
    # zizmor is pinned so a new release with new audits can't fail an unchanged workflow: raise it on purpose.
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.14"
      - name: zizmor
        run: python -m pip install zizmor==1.32.0 && zizmor --offline .github/workflows .forgejo/workflows
