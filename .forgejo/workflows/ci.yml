name: CI
on:
  push:
  pull_request:

permissions: {}

defaults:
  run:
    working-directory: storageforge-indexer

jobs:
  test:
    name: Tests
    permissions:
      contents: read
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sf
          POSTGRES_PASSWORD: sftest
        options: >-
          --health-cmd "pg_isready -U sf" --health-interval 5s --health-timeout 5s --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        database: [sqlite, postgres]
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/pw-browsers  # tests/ci.sh runs as another user, who must find them
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Tools the tests call
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openssh-client openssh-server util-linux rsync shellcheck
      - name: Install
        run: python -m pip install -e ".[postgres]" playwright && python -m playwright install --with-deps chromium
      - name: Planner and capacity.py agree
        run: node tests/vectors/check.mjs
      - name: Tests on SQLite
        if: matrix.database == 'sqlite'
        run: bash tests/ci.sh
      - name: Tests on PostgreSQL
        if: matrix.database == 'postgres'
        env:
          STORAGEFORGE_TEST_PG: postgresql://sf:sftest@postgres:5432/postgres
        run: bash tests/ci.sh

  lint:
    name: Lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: Ruff
        run: python -m pip install ruff && ruff check storageforge_index tests
      - name: Shell scripts
        run: sudo apt-get update && sudo apt-get install -y shellcheck && shellcheck --severity=error docker/*.sh examples/demo/*.sh

  image:
    name: Image scan
    permissions:
      contents: read
    # Fails on a critical that is not decided in .trivyignore. See notebook/Audit 2026-10-31/Container scan triage 2026-10-31.md
    # The runner's docker label must be docker:host: the bind mounts below name paths on the machine running Docker.
    runs-on: docker
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: Image scan
        run: |
          docker build -t storageforge:ci --target runtime storageforge-indexer
          docker save storageforge:ci -o /tmp/image.tar
          docker run --rm -v /tmp/image.tar:/image.tar:ro -v "$PWD/.trivyignore:/.trivyignore:ro" aquasec/trivy:latest \
            image --quiet --input /image.tar --severity CRITICAL --exit-code 1 --ignorefile /.trivyignore

  zizmor:
    # Audits these workflows for template injection, persisted credentials, unpinned actions and broad permissions.
    # zizmor is pinned so a new release with new audits can't fail an unchanged workflow: raise it on purpose.
    name: Workflow audit (zizmor)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"
      - name: zizmor
        run: python -m pip install zizmor==1.32.0 && zizmor --offline .github/workflows .forgejo/workflows
